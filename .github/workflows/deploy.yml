name: Deploy to VPS

on:
  push:
    branches:
      - main
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@master
        env:
          BRANCH: ${{ github.ref_name }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: BRANCH
          script: |
            # Set dynamic variables based on branch (main or staging)
            TARGET_DIR="/var/www/$BRANCH"
            BACKEND_NAME="$BRANCH-backend"
            FRONTEND_NAME="$BRANCH-frontend"

            # Assign appropriate frontend port
            if [ "$BRANCH" == "main" ]; then
              FRONTEND_PORT=3000
            else
              FRONTEND_PORT=3001
            fi

            echo "Deploying $BRANCH branch to $TARGET_DIR..."

            # 1. Pull Latest Code
            cd $TARGET_DIR
            git fetch origin
            git reset --hard origin/$BRANCH

            # 2. Update and Restart Backend
            cd backend
            npm install --include=dev
            npm run build
            pm2 restart $BACKEND_NAME || pm2 start dist/main.js --name "$BACKEND_NAME"

            # 3. Update and Restart Frontend
            cd ../frontend
            npm install
            npm run build
            pm2 restart $FRONTEND_NAME || PORT=$FRONTEND_PORT pm2 start npm --name "$FRONTEND_NAME" -- start

            # 4. Save State
            pm2 save