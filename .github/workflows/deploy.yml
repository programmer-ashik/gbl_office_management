name: Deploy to VPS

on:
  push:
    branches:
      - main
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@master
        env:
          BRANCH: ${{ github.ref_name }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: BRANCH
          script: |
            TARGET_DIR="/var/www/${{ github.ref_name }}"

            # 1. Pull latest code
            cd $TARGET_DIR
            git fetch origin
            git reset --hard origin/${{ github.ref_name }}

            # 2. Build Frontend
            cd $TARGET_DIR/frontend
            npm install
            npm run build

            # 3. Build and Restart Backend
            cd $TARGET_DIR/backend
            npm install
            npm run build  # <-- CRITICAL: Compiles your TypeScript

            # Safely restart if it exists, otherwise start a new instance
            pm2 restart ${{ github.ref_name }}-backend --update-env || pm2 start npm --name "${{ github.ref_name }}-backend" -- start
            pm2 save
